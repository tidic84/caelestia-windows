[package]
name = "ilot"
version = "0.4.19"
edition = "2021"
rust-version = "1.89"
description = "Ilot facon Caelestia pour Windows"

[lib]
name = "ilot_core"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order : ~/.claude/settings.json garde l'ordre de ses cles (claude.rs)
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp", "gif"] }
# couleur source du theme (QuantizerCelebi + Score, comme material-color-utilities)
material-colors = "0.4"
sysinfo = "0.33"
arboard = { version = "3", default-features = false, features = ["image-data"] }
windows-core = "0.61"
windows-future = "0.2"
ureq = { version = "2", features = ["native-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
imap = "2.4"
native-tls = "0.2"
mailparse = "0.18"
qrcode = { version = "0.14", default-features = false }
# Quick Share (protocole Nearby Share de Google)
prost = "0.13"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
rand = "0.8"
mdns-sd = "0.13"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "adpcm"] }
windows = { version = "0.61", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_Advertisement",
  "Devices_Enumeration",
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WiFi",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Rpc",
  "Win32_System_Services",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_Wmi",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
