<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ilot sous-titres</title>
<style>
  /* bandeau des sous-titres en direct (src/captions.rs) : texte reconnu par
     Live Captions, traduit en français par le service de la page Traduction */
  @font-face { font-family: 'Rubik'; src: url(vendor/rubik-latin.woff2) format('woff2'); font-weight: 300 700; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: Rubik, 'Segoe UI', sans-serif; }
  .box { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); max-width: calc(100% - 20px); box-sizing: border-box;
    padding: 10px 22px 12px; border-radius: 18px; background: rgb(10 10 14 / .78); backdrop-filter: blur(12px);
    color: #fff; text-align: center; opacity: 0; transition: opacity .3s; box-shadow: 0 8px 30px rgb(0 0 0 / .35); }
  .box.on { opacity: 1; }
  .tr { font-size: 22px; font-weight: 500; line-height: 1.3; text-shadow: 0 1px 2px rgb(0 0 0 / .6);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .src { margin-top: 4px; font-size: 13px; color: rgb(255 255 255 / .6);
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .src:empty { display: none; }
  .hint { font-size: 14px; color: #ffd27a; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ff5a5a; margin-right: 8px; vertical-align: middle; animation: b 1.4s infinite; }
  @keyframes b { 50% { opacity: .3; } }
</style>
</head>
<body>
<div class="box"><div class="tr"></div><div class="src"></div></div>
<script>
const { listen } = window.__TAURI__.event;
const { invoke } = window.__TAURI__.core;
const box = document.querySelector('.box'), trEl = box.querySelector('.tr'), srcEl = box.querySelector('.src');
let cfg = { translate: true, to: 'fr' };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('captions') || '{}')); } catch {}
let pending = '', busy = false, lastTr = '', hideTimer = null;
function show() {
  box.classList.add('on');
  clearTimeout(hideTimer);
  // plus personne ne parle : le bandeau s'efface
  hideTimer = setTimeout(() => box.classList.remove('on'), 6000);
}
async function translateLoop() {
  if (busy || !pending) return;
  busy = true;
  const text = pending;
  pending = '';
  try {
    const r = await invoke('translate', { text, from: '', to: cfg.to });
    // déjà en français : pas de doublon
    if (r.detected === cfg.to) { trEl.textContent = text; srcEl.textContent = ''; }
    else { trEl.textContent = r.text; srcEl.textContent = text.split('\n').pop(); }
    show();
  } catch {
    trEl.textContent = text; srcEl.textContent = '';
  }
  // une traduction toutes les 0,6 s au plus : le texte change en continu
  setTimeout(() => { busy = false; translateLoop(); }, 600);
}
listen('captions', ({ payload: c }) => {
  if (c.status === 'starting' && !c.text) {
    trEl.innerHTML = '<span class="dot"></span>Sous-titres en direct…';
    srcEl.innerHTML = '<span class="hint">1re fois : accepte le téléchargement de la langue dans la fenêtre Live Captions</span>';
    show();
    return;
  }
  if (c.status === 'missing') { trEl.textContent = 'Live Captions introuvable sur ce PC'; srcEl.textContent = ''; show(); return; }
  if (c.status === 'docked' && !c.text) {
    trEl.textContent = 'Live Captions est ancré en haut de l’écran';
    srcEl.innerHTML = '<span class="hint">Dans Live Captions ⚙️ › Position › Flottante</span>';
    show();
    return;
  }
  if (!c.text || c.text === lastTr) return;
  lastTr = c.text;
  if (!cfg.translate) { trEl.textContent = c.text.split('\n').pop(); srcEl.textContent = ''; show(); return; }
  pending = c.text;
  translateLoop();
});
listen('captions-cfg', ({ payload }) => {
  Object.assign(cfg, payload);
  try { localStorage.setItem('captions', JSON.stringify(cfg)); } catch {}
});
</script>
</body>
</html>
